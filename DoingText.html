<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text-Processing-Tools | 在线文本处理工具箱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px 32px;
      text-align: center;
    }
    header h1 { font-size: 24px; font-weight: 600; }
    header p { font-size: 14px; opacity: 0.9; margin-top: 6px; }
    .container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .panel {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 600;
      color: #555;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-title .icon { font-size: 16px; }
    textarea {
      width: 100%;
      flex: 1;
      min-height: 280px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.6;
    }
    textarea:focus { border-color: #667eea; }
    .toolbar {
      grid-column: 1 / -1;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 16px 20px;
    }
    .toolbar-group {
      margin-bottom: 12px;
    }
    .toolbar-group:last-child { margin-bottom: 0; }
    .group-label {
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      padding: 8px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fafafa;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      color: #333;
    }
    .btn:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    .btn:active { transform: scale(0.96); }
    .stats {
      grid-column: 1 / -1;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 12px 20px;
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: #666;
    }
    .stats span { font-weight: 600; color: #667eea; }
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: white;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
      .stats { flex-wrap: wrap; gap: 12px; }
    }
  </style>
</head>
<body>

<header>
  <h1> Text-Processing-Tools</h1>
  <p>轻量在线文本处理工具箱 · 浏览器直接使用，无需安装</p>
</header>

<div class="container">

  <div class="panel">
    <div class="panel-title"><span class="icon"></span> 原始文本</div>
    <textarea id="input" placeholder="在这里粘贴或输入文本..."></textarea>
  </div>

  <div class="panel">
    <div class="panel-title"><span class="icon">📤</span> 处理结果</div>
    <textarea id="output" placeholder="处理后的文本将显示在这里..." readonly></textarea>
  </div>

  <div class="toolbar">
    <div class="toolbar-group">
      <div class="group-label">去空格 & 换行</div>
      <div class="btn-row">
        <button class="btn" onclick="processText('trim')">去除首尾空格</button>
        <button class="btn" onclick="processText('trimAllSpaces')">去除所有空格</button>
        <button class="btn" onclick="processText('removeBlankLines')">去除空行</button>
        <button class="btn" onclick="processText('mergeSpaces')">合并连续空格</button>
        <button class="btn" onclick="processText('removeNewlines')">去除所有换行</button>
        <button class="btn" onclick="processText('normalizeNewlines')">统一换行符</button>
      </div>
    </div>

    <div class="toolbar-group">
      <div class="group-label">大小写转换</div>
      <div class="btn-row">
        <button class="btn" onclick="processText('upper')">全大写</button>
        <button class="btn" onclick="processText('lower')">全小写</button>
        <button class="btn" onclick="processText('capitalize')">首字母大写</button>
        <button class="btn" onclick="processText('titleCase')">每个单词首字母大写</button>
        <button class="btn" onclick="processText('swapCase')">大小写互换</button>
      </div>
    </div>

    <div class="toolbar-group">
      <div class="group-label">文本脱敏</div>
      <div class="btn-row">
        <button class="btn" onclick="processText('maskPhone')">手机号脱敏</button>
        <button class="btn" onclick="processText('maskIdCard')">身份证脱敏</button>
        <button class="btn" onclick="processText('maskEmail')">邮箱脱敏</button>
        <button class="btn" onclick="processText('maskAll')">一键全部脱敏</button>
      </div>
    </div>

    <div class="toolbar-group">
      <div class="group-label">其他</div>
      <div class="btn-row">
        <button class="btn" onclick="processText('copyOutput')">📋 复制结果</button>
        <button class="btn" onclick="processText('clear')">🗑️ 清空</button>
        <button class="btn" onclick="processText('reverse')">文本反转</button>
        <button class="btn" onclick="processText('uniqueLines')">去重行</button>
        <button class="btn" onclick="processText('sortLines')">排序行</button>
      </div>
    </div>
  </div>

  <div class="stats">
    <div>字符数：<span id="charCount">0</span></div>
    <div>单词数：<span id="wordCount">0</span></div>
    <div>行数：<span id="lineCount">0</span></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');

  input.addEventListener('input', updateStats);
  function updateStats() {
    const text = input.value;
    document.getElementById('charCount').textContent = text.length;
    document.getElementById('wordCount').textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
    document.getElementById('lineCount').textContent = text ? text.split('\n').length : 0;
  }

  function processText(type) {
    let text = input.value;
    if (!text && type !== 'clear' && type !== 'copyOutput') {
      showToast('请先输入文本');
      return;
    }

    switch (type) {
      case 'trim':
        output.value = text.split('\n').map(l => l.trim()).join('\n').trim();
        break;
      case 'trimAllSpaces':
        output.value = text.replace(/\s+/g, '');
        break;
      case 'removeBlankLines':
        output.value = text.split('\n').filter(l => l.trim()).join('\n');
        break;
      case 'mergeSpaces':
        output.value = text.replace(/ +/g, ' ');
        break;
      case 'removeNewlines':
        output.value = text.replace(/\n+/g, '');
        break;
      case 'normalizeNewlines':
        output.value = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        break;
      case 'upper':
        output.value = text.toUpperCase();
        break;
      case 'lower':
        output.value = text.toLowerCase();
        break;
      case 'capitalize':
        output.value = text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
        break;
      case 'titleCase':
        output.value = text.replace(/\b\w/g, c => c.toUpperCase());
        break;
      case 'swapCase':
        output.value = text.split('').map(c =>
          c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()
        ).join('');
        break;
      case 'maskPhone':
        output.value = text.replace(/1[3-9]\d{9}/g, m => m.slice(0, 3) + '****' + m.slice(7));
        break;
      case 'maskIdCard':
        output.value = text.replace(/\d{17}[\dXx]/g, m => m.slice(0, 3) + '***********' + m.slice(14));
        break;
      case 'maskEmail':
        output.value = text.replace(/(\w)[\w.]*@([\w.]+\.\w+)/g, '$1***@$2');
        break;
      case 'maskAll':
        text = text.replace(/1[3-9]\d{9}/g, m => m.slice(0, 3) + '****' + m.slice(7));
        text = text.replace(/\d{17}[\dXx]/g, m => m.slice(0, 3) + '***********' + m.slice(14));
        text = text.replace(/(\w)[\w.]*@([\w.]+\.\w+)/g, '$1***@$2');
        output.value = text;
        break;
      case 'copyOutput':
        if (output.value) {
          navigator.clipboard.writeText(output.value).then(() => showToast('已复制到剪贴板'));
        } else {
          showToast('没有可复制的内容');
        }
        return;
      case 'clear':
        input.value = '';
        output.value = '';
        updateStats();
        showToast('已清空');
        return;
      case 'reverse':
        output.value = text.split('').reverse().join('');
        break;
      case 'uniqueLines':
        output.value = [...new Set(text.split('\n'))].join('\n');
        break;
      case 'sortLines':
        output.value = text.split('\n').sort().join('\n');
        break;
    }

    showToast('处理完成');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }
</script>

</body>
</html>
